services:
  mock-provider:
    build:
      context: ./mock-provider
      dockerfile: Dockerfile
    image: payflow-mock-provider:dev
    container_name: payflow-mock-provider
    ports:
      - "${MOCK_PROVIDER_PORT}:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ping', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    image: payflow-payment-service:dev
    container_name: payflow-payment-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE}
      OUTBOX_RELAY_POLL_INTERVAL_SECONDS: ${OUTBOX_RELAY_POLL_INTERVAL_SECONDS}
      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      PAYMENT_PROVIDER_URL: http://mock-provider:8001
      PAYMENT_PROVIDER_TIMEOUT_SECONDS: ${PAYMENT_PROVIDER_TIMEOUT_SECONDS}
      PAYMENT_PROVIDER_MAX_ATTEMPTS: ${PAYMENT_PROVIDER_MAX_ATTEMPTS}
      PAYMENT_PROVIDER_RETRY_BASE_DELAY_SECONDS: ${PAYMENT_PROVIDER_RETRY_BASE_DELAY_SECONDS}
      PAYMENT_PROVIDER_FAILURE_THRESHOLD: ${PAYMENT_PROVIDER_FAILURE_THRESHOLD}
      PAYMENT_PROVIDER_RECOVERY_TIMEOUT_SECONDS: ${PAYMENT_PROVIDER_RECOVERY_TIMEOUT_SECONDS}
    ports:
      - "${PAYMENT_SERVICE_PORT}:${APP_PORT}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      mock-provider:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    image: payflow-analytics-service:dev
    container_name: payflow-analytics-service
    environment:
      DATABASE_URL: ${ANALYTICS_DATABASE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKA_CONSUMER_GROUP: ${ANALYTICS_KAFKA_CONSUMER_GROUP}
      REDIS_URL: ${ANALYTICS_REDIS_URL}
      APP_HOST: ${ANALYTICS_APP_HOST}
      APP_PORT: ${ANALYTICS_APP_PORT}
    ports:
      - "${ANALYTICS_SERVICE_PORT}:${ANALYTICS_APP_PORT}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/ping', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      analytics-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  postgres:
    image: postgres:17-alpine
    container_name: payflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
  analytics-db:
    image: postgres:17-alpine
    container_name: payflow-analytics-postgres
    environment:
      POSTGRES_DB: ${ANALYTICS_POSTGRES_DB}
      POSTGRES_USER: ${ANALYTICS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ANALYTICS_POSTGRES_PASSWORD}
    ports:
      - "${ANALYTICS_POSTGRES_PORT}:5432"
    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
  redis:
    image: redis:8-alpine
    container_name: payflow-redis
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: payflow-kafka
    ports:
      - "${KAFKA_HOST_PORT}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      KAFKA_LISTENERS: >-
        CONTROLLER://:29093,
        INTERNAL://:9092,
        EXTERNAL://:29092

      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka:9092,
        EXTERNAL://localhost:${KAFKA_HOST_PORT}

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      CLUSTER_ID: ${KAFKA_CLUSTER_ID}

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: payflow-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      [
        "/opt/kafka/bin/kafka-topics.sh",
        "--bootstrap-server",
        "kafka:9092",
        "--create",
        "--if-not-exists",
        "--topic",
        "${KAFKA_TOPIC}",
        "--partitions",
        "3",
        "--replication-factor",
        "1",
      ]

volumes:
  postgres_data:
  analytics_postgres_data:
  kafka_data:
